[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "course-capture"
version = "0.1.0"
description = "Turn authorized course exports into a private, searchable, captioned study system."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Shivraj Singh Bhatti" }]
keywords = ["education", "automation", "transcription", "canvas", "ffmpeg"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Education",
]
dependencies = []

[project.optional-dependencies]
mlx = ["mlx-whisper>=0.4; platform_system == 'Darwin' and platform_machine == 'arm64'"]
dev = []

[project.scripts]
course-capture = "course_capture.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
